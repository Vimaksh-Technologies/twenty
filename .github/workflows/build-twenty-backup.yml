name: Build Twenty backup helper

on:
  push:
    paths:
      - deploy/dokploy/twenty/backup/**
      - .github/workflows/build-twenty-backup.yml
  pull_request:
    paths:
      - deploy/dokploy/twenty/backup/**
      - .github/workflows/build-twenty-backup.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/vimaksh-technologies/twenty-backup

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build helper for smoke test
        uses: docker/build-push-action@v6
        with:
          context: deploy/dokploy/twenty/backup
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify invalid database connectivity fails closed
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          printf '%s\n' \
            'PRIMARY_R2_ENDPOINT=https://primary.invalid' \
            'PRIMARY_R2_ACCESS_KEY_ID=not-a-secret' \
            'PRIMARY_R2_SECRET_ACCESS_KEY=not-a-secret' \
            'PRIMARY_R2_BUCKET=primary-test' \
            'BACKUP_R2_ENDPOINT=https://backup.invalid' \
            'BACKUP_R2_ACCESS_KEY_ID=not-a-secret' \
            'BACKUP_R2_SECRET_ACCESS_KEY=not-a-secret' \
            'BACKUP_R2_BUCKET=backup-test' \
            > "$test_dir/twenty-backup.env"
          if docker run --rm \
            --env PG_DATABASE_URL='postgresql://invalid:invalid@127.0.0.1:1/invalid' \
            --env BACKUP_HEALTHCHECK_URL='https://healthcheck.invalid' \
            --env BACKUP_SECRETS_FILE=/run/secrets/twenty-backup.env \
            --env BACKUP_INTERVAL_SECONDS=86400 \
            --volume "$test_dir/twenty-backup.env:/run/secrets/twenty-backup.env:ro" \
            "${IMAGE_NAME}:${GITHUB_SHA}"; then
            echo 'Backup helper unexpectedly succeeded with an invalid database.' >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable helper image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: deploy/dokploy/twenty/backup
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

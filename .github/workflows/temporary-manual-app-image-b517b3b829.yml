name: Temporary manual app image b517b3b829

on:
  push:
    branches:
      - 'ci/temporary-manual-app-image-b517b3b829'

permissions:
  contents: read
  packages: write

env:
  SOURCE_SHA: b517b3b82901b95c379e1dcb49f05866b2ffe969
  IMAGE_TAG: ghcr.io/vimaksh-technologies/twenty:b517b3b82901b95c379e1dcb49f05866b2ffe969

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Assert exact release source
        shell: bash --noprofile --norc -euo pipefail {0}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable linux amd64 app image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          build-args: APP_VERSION=${{ env.SOURCE_SHA }}
          push: true
          tags: ${{ env.IMAGE_TAG }}
